services:
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    ports: ["5173:80"]
    depends_on: [api]
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://vantiv:vantiv@postgres:5432/vantiv
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vantiv, POSTGRES_PASSWORD: vantiv, POSTGRES_DB: vantiv }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantiv -d vantiv"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
